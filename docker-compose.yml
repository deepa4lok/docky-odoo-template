
networks:
  default:
#    name: magnus-prod
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1450

services:
  nginx:
    image: nginx:latest
#    labels:
#      com.github.jrcs.letsencrypt_nginx_proxy_companion.nginx_proxy: "true"
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${NGINX_FILES_PATH}/conf.d:/etc/nginx/conf.d
      - ${NGINX_FILES_PATH}/vhost.d:/etc/nginx/vhost.d
      - ${NGINX_FILES_PATH}/html:/usr/share/nginx/html
      - ${NGINX_FILES_PATH}/certs:/etc/nginx/certs:ro

  nginx-gen:
    image: jwilder/docker-gen
    command: -notify-sighup nginx -watch -wait 5s:30s /etc/docker-gen/templates/nginx.tmpl /etc/nginx/conf.d/default.conf
    container_name: nginx-gen
    restart: unless-stopped
    volumes:
      - ${NGINX_FILES_PATH}/conf.d:/etc/nginx/conf.d
      - ${NGINX_FILES_PATH}/vhost.d:/etc/nginx/vhost.d
      - ${NGINX_FILES_PATH}/html:/usr/share/nginx/html
      - ${NGINX_FILES_PATH}/certs:/etc/nginx/certs:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./nginx.tmpl:/etc/docker-gen/templates/nginx.tmpl:ro

  db15:
    environment:
      - POSTGRES_USER=${PGUSER}
      - POSTGRES_DB=${PGDATABASE}
      - POSTGRES_PASSWORD=${PGPASSWORD}
    image: postgres:15.2
    restart: unless-stopped
#    networks:
#      - backend-prod
    volumes:
      - .db/data/:/var/lib/postgresql/data
    ports:
      - 5432:5432

  odoo:
    build: odoo
#    image: xxx
    environment:
      - MIGRATE=${MIGRATE}
      - PYTHONDONTWRITEBYTECODE=${PDWBC}
      - LOCAL_USER_ID=${UID}
      - DB_USER=${PGUSER}
      - DB_PASS=${PGPASSWORD}
      - DB_NAME=$DB_NAME
      - DB_FILTER=${DB_FILTER}
      - ADMIN_PASSWD=${ADMIN_PASSWD}
      - RUNNING_ENV=${ENV}
      - LIST_DB=${LIST_DB}
#     - DEMO=False 
      - LIMIT_TIME_CPU=${LIMIT_TIME_CPU}
      - LIMIT_TIME_REAL=${LIMIT_TIME_REAL}
      - DB_HOST=${DB_HOST}
      - ADDONS_PATH=${ADDONS_PATH}
#      - MARABUNTA_MODE=demo
      - VIRTUAL_HOST=${HOST}
      - VIRTUAL_PORT=8069,8072/longpolling
      - KWKHTMLTOPDF_SERVER_URL=http://kwkhtmltopdf:8080
      - ODOO_REPORT_URL=http://localhost:8069
    expose:
      - 8069
      - 8072
#    networks:
#      - xxx_default
#      - backend-prod
    volumes:
      - ./odoo:/odoo
      - ./data/addons:/data/odoo/addons
      - ./data/filestore:/data/odoo/filestore
      - ./data/sessions:/data/odoo/sessions
#    command: ["odoo"]
    command: ["bash"]
    stdin_open: true
    tty: true
    extra_hosts:
      - "casa.tosc.nl:10.225.12.141"

  ocr:
    build:
      context: ./ocrmypdf
      dockerfile: Dockerfile
    image: magnus-registry:443/ocrmypdf:nld
#    image: jbarlow83/ocrmypdf:latest
    entrypoint: python3
    restart: unless-stopped
    expose:
      - 5000
    command: ["webservice.py"]

  kwkhtmltopdf:
    image: ghcr.io/acsone/kwkhtmltopdf:0.12.1.3-latest
    restart: unless-stopped
    expose:
     - 8080

version: '3'
